<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tennis Scoreboard</title>

<style>
    body {
        margin: 0;
        background: #f3f3f3;
        font-family: Arial, Helvetica, sans-serif;
    }

    .scoreboard {
        width: 860px;
        margin: 30px auto;
        background: #fff;
        border: 1px solid #d9d9d9;
        border-radius: 0 0 15px 15px;
        overflow: hidden;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    thead th {
        font-size: 14px;
        color: #333;
        font-weight: bold;
        text-align: center;
        padding: 10px 0;
        border-bottom: 1px solid #dcdcdc;
    }

    thead th:first-child {
        text-align: left;
        padding-left: 16px;
    }

    tbody td {
        padding: 18px 0;
        border-bottom: 1px solid #e5e5e5;
        vertical-align: middle;
        text-align: center;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    .team-cell {
        text-align: left;
        padding-left: 16px;
        width: 68%;
    }

    .team-name {
        font-size: 18px;
        font-weight: bold;
        color: #111;
        margin-bottom: 4px;
    }

    .players {
        font-size: 15px;
        color: #5d6b84;
    }

    .score {
        font-size: 22px;
        font-weight: bold;
        color: #111;
    }

    .points {
        color: #1e73be;
    }

    .col-small {
        width: 10%;
    }
</style>
</head>
<body>

<div class="scoreboard">
    <table>
        <thead>
            <tr>
                <th>Team</th>
                <th class="col-small">Sets</th>
                <th class="col-small">Games</th>
                <th class="col-small">Points</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td class="team-cell">
                    <div class="team-name">Team A</div>
                    <div class="players">Player A1 &amp; Player A2</div>
                </td>
                <td><div class="score">1</div></td>
                <td><div class="score">2</div></td>
                <td><div class="score points">0</div></td>
            </tr>

            <tr>
                <td class="team-cell">
                    <div class="team-name">Team B</div>
                    <div class="players">Player B1 &amp; Player B2</div>
                </td>
                <td><div class="score">0</div></td>
                <td><div class="score">0</div></td>
                <td><div class="score points">0</div></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
